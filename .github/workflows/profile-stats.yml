name: Profile stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-stats.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate images
        run: node scripts/generate.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          OUT_DIR: assets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets

      - id: deployment
        uses: actions/deploy-pages@v4
